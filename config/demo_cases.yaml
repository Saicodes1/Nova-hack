# Demo cases shown in the data-source menu, real ones first (the first is the default).
# Real cases pin catalog scenes (item_a / item_b), so they replay identically and can run
# offline once prepared:  python -m scripts.prep_demo fetch && python -m scripts.prep_demo run
# Cases without pins use synthetic imagery and are labelled "Synthetic" in the menu.
cases:
  - id: storm
    title: Dubai storm flood, April 2024
    name: Al Maktoum, Dubai
    aoi: config/eval_aois/dubai_storm.geojson
    intent: water_gain
    date_a: '2024-03-28'
    date_b: '2024-04-22'
    item_a: [S2A_T40RBN_20240328T065608_L2A, S2A_T40RCN_20240328T065608_L2A]
    item_b: [S2B_T40RBN_20240422T065245_L2A, S2B_T40RCN_20240422T065245_L2A]
    question: Did standing water appear after the April 2024 storm?
